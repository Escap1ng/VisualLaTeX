name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS 语法检查
        run: |
          for file in main.js workspace.js project-model.js project-archive.js preview.js compiler.mjs pdf-preview.mjs server.mjs; do
            node --check "$file"
          done

      # 无头冒烟检查：资源完整、标签配对、DOM id 一致性
      - name: 冒烟检查
        run: node tests/smoke.mjs

      - name: 编辑、编译服务与预览回归测试
        run: node --test
