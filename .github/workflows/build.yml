name: Build & Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JS 语法检查
        shell: pwsh
        run: |
          foreach ($file in @('main.js', 'workspace.js', 'project-model.js', 'project-archive.js', 'preview.js', 'compiler.mjs', 'pdf-preview.mjs', 'server.mjs')) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: 冒烟检查
        run: node tests/smoke.mjs

      - name: 编辑、编译服务与预览回归测试
        run: node --test

      # 工具链由用户自行安装，不将第三方引擎二进制打入源码包。
      - name: 打包项目为 zip
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $name = "VisualLaTeX-$tag"
          New-Item -ItemType Directory -Path $name -Force | Out-Null
          Copy-Item index.html, style.css, workspace.css, preview.css, main.js, workspace.js, project-model.js, project-archive.js, preview.js, compiler.mjs, pdf-preview.mjs, server.mjs, start.ps1, setup-windows.ps1, LICENSE, README.md, README.en.md -Destination $name
          Copy-Item screenshots -Destination $name -Recurse
          Copy-Item tests -Destination $name -Recurse
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: VisualLaTeX-*.zip
