name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 对 Pages 的写权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只保留一次部署，避免并发冲突
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 验证待部署的同一提交
        run: |
          for file in main.js workspace.js project-model.js project-archive.js preview.js compiler.mjs server.mjs; do
            node --check "$file"
          done
          node tests/smoke.mjs
          node --test

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 准备静态编辑器
        run: |
          mkdir site
          cp index.html style.css workspace.css preview.css main.js workspace.js project-model.js project-archive.js preview.js LICENSE site/

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site   # Pages 仅提供编辑；编译需要本机 Node 服务和工具链。

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
